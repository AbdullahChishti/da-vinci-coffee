kind = "web"
previewPath = "/"
title = "da vinci"
version = "1.0.0"
id = "artifacts/da-vinci"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21044

[services.development]
run = "pnpm --filter @workspace/da-vinci run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/da-vinci", "run", "build" ]
publicDir = "artifacts/da-vinci/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21044"
BASE_PATH = "/"
